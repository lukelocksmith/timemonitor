services:
  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/activity.db
      # Auth (wymagane)
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # ClickUp (wymagane)
      - CLICKUP_API_TOKEN=${CLICKUP_API_TOKEN}
      - CLICKUP_WEBHOOK_SECRET=${CLICKUP_WEBHOOK_SECRET:-}
      - CLICKUP_TEAM_ID=${CLICKUP_TEAM_ID:-}
      # CORS
      - FRONTEND_URL=${FRONTEND_URL}
      # Notion (opcjonalne)
      - NOTION_API_KEY=${NOTION_API_KEY:-}
      - NOTION_VERSION=${NOTION_VERSION:-2022-06-28}
    volumes:
      - activity-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      # Kontener moze byc w kilku sieciach Dockera. Bez tej etykiety Traefik wybiera
      # siec losowo przy kazdym przeladowaniu configu i potrafi trafic w siec, ktorej
      # coolify-proxy nie widzi -> kazde zapytanie wisi 30 s i konczy sie 504.
      - "traefik.docker.network=owkkkkgcw000wk84ccs88kc4"
      - "traefik.http.services.backend-owkkkkgcw000wk84ccs88kc4.loadbalancer.server.port=3001"
      # Aktywny health check: martwy upstream = natychmiastowe 503 zamiast 30 s ciszy,
      # i automatyczny powrot do ruchu gdy kontener znow odpowiada.
      - "traefik.http.services.backend-owkkkkgcw000wk84ccs88kc4.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.backend-owkkkkgcw000wk84ccs88kc4.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.backend-owkkkkgcw000wk84ccs88kc4.loadbalancer.healthcheck.timeout=3s"

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.docker.network=owkkkkgcw000wk84ccs88kc4"
      - "traefik.http.services.frontend-owkkkkgcw000wk84ccs88kc4.loadbalancer.server.port=80"
      - "traefik.http.services.frontend-owkkkkgcw000wk84ccs88kc4.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.frontend-owkkkkgcw000wk84ccs88kc4.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.frontend-owkkkkgcw000wk84ccs88kc4.loadbalancer.healthcheck.timeout=3s"

volumes:
  activity-data:
